context:
  version: ${{ env.get("PKG_VERSION", default="0.0.0") }}

package:
  name: q-kx-arrow
  version: ${{ version }}

source:
  path: ..
  filter:
    exclude:
      - recipe/**

build:
  number: 0
  string: arrow${{ libarrow | replace(".", "_") }}_h${{ hash }}_${{ build_number }}

requirements:
  build:
    - ${{ compiler("cxx") }}
    - if: linux
      then:
        - ${{ stdlib("c") }}
    - cmake
    - make
  host:
    - libarrow
    - libparquet

about:
  homepage: https://github.com/KxSystems/arrowkdb
  repository: https://github.com/KxSystems/arrowkdb
  license: Apache-2.0
  license_file: LICENSE
  summary: kdb-X interface for reading and writing Apache Arrow and Parquet data.
  description: >-
    kdb-X module that allows reading and writing Apache Arrow data stored in
    Apache Parquet files, Arrow IPC record batch files and Arrow IPC record
    batch streams.

tests:
  - script:
    - if: unix
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/arrow/init.q
    - if: linux and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/arrow/clib.li64.so
    - if: linux and aarch64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/arrow/clib.la64.so
    - if: osx and arm64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/arrow/clib.ma64.so
    - if: osx and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/arrow/clib.mi64.so
    - if: win
      then:
        - if not exist %PREFIX%\\lib\\q\\mod\\kx\\arrow\\init.q exit 1
        - if not exist %PREFIX%\\lib\\q\\mod\\kx\\\arrow\\clib.wi64.dll exit 1

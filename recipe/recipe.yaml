context:
  version: "2.0.1"

package:
  name: q-kx-arrow
  version: ${{ version }}

source:
  path: ..
  filter:
    exclude:
      - recipe/**

build:
  number: 0
  string: arrow${{ libarrow | replace(".", "_") }}_h${{ hash }}_${{ build_number }}

requirements:
  build:
    - ${{ compiler("cxx") }}
    - if: linux
      then:
        - ${{ stdlib("c") }}
    - cmake
    - make
  host:
    - libarrow
    - libparquet

tests:
  - script:
    - if: unix
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/arrow/init.q
        - test -f ${PREFIX}/etc/conda/activate.d/q-kx-arrow.sh
        - test -f ${PREFIX}/etc/conda/deactivate.d/q-kx-arrow.sh
    - if: linux and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/arrow/clib.li64.so
    - if: linux and aarch64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/arrow/clib.la64.so
    - if: osx and arm64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/arrow/clib.ma64.so
    - if: osx and x86_64
      then:
        - test -f ${PREFIX}/lib/q/mod/kx/arrow/clib.mi64.so
    - if: win
      then:
        - if not exist %PREFIX%\\lib\\q\\mod\\kx\\arrow\\init.q exit 1
        - if not exist %PREFIX%\\lib\\q\\mod\\kx\\\arrow\\clib.wi64.dll exit 1
